<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 6/45 자동생성 위젯 (노션 임베드용)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard Web Font -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* 노션 임베드 시 외부 여백 및 배경 완전 투명화 */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      width: 100%;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* 로또 공 등장 애니메이션 */
    @keyframes ballPop {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      75% {
        transform: scale(1.06);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .ball-animate {
      animation: ballPop 0.3s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    /* 레퍼런스 이미지 기반 플랫 & 깔끔한 로또 공 스타일 */
    .lotto-ball {
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.02em;
      user-select: none;
      flex-shrink: 0;
      text-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.12);
    }

    /* 번호 대역별 컬러 팔레트 */
    .ball-yellow { background-color: #FBC400; } /* 1 ~ 10 */
    .ball-blue   { background-color: #69C8F2; } /* 11 ~ 20 */
    .ball-red    { background-color: #FF7272; } /* 21 ~ 30 */
    .ball-gray   { background-color: #AAAAAA; } /* 31 ~ 40 */
    .ball-green  { background-color: #B0D840; } /* 41 ~ 45 */

    /* 게임 행 카드 (#F6F8FB) */
    .game-row {
      background-color: #F6F8FB;
      border-radius: 12px;
      padding: 7px 10px;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .game-row:hover {
      background-color: #EDF2F7;
    }
    .game-row:active {
      transform: scale(0.992);
    }

    /* 우측 하단 ㄴ자 모서리 리사이즈 핸들 (단독 유지) */
    .handle-corner {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 20px;
      height: 20px;
      cursor: nwse-resize;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 2px;
      z-index: 30;
      color: #475569;
      opacity: 0.85;
      touch-action: none;
      transition: opacity 0.15s ease, color 0.15s ease;
    }
    .handle-corner:hover {
      opacity: 1;
      color: #0F172A;
    }
  </style>
</head>
<body>
  <!-- 노션 좌상단 밀착 래퍼 (기본 컴팩트 폭 300px) -->
  <div id="widgetWrapper" class="relative select-none" style="width: 300px; max-width: 100%; margin: 0; padding: 0;">
    
    <!-- 실제 위젯 본문 영역 (비율 스케일링 대상) -->
    <div id="widgetContent" class="relative bg-transparent" style="width: 300px; transform-origin: top left;">
      
      <!-- 1. 상단 헤더 영역 -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <!-- 좌측: 에메랄드 점 + LOTTO 6/45 + 타이틀 -->
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="inline-block w-1.5 h-1.5 rounded-full shrink-0" style="background-color: #14B88A;"></span>
            <span class="text-[10px] font-bold tracking-wider uppercase" style="color: #94A3B8;">LOTTO 6/45</span>
          </div>
          <h1 class="text-[15.5px] font-extrabold tracking-tight leading-tight truncate" style="color: #0F172A;">
            로또 번호 자동생성
          </h1>
        </div>

        <!-- 우측: 자동 5게임 / 5,000원 + 원형 액션 버튼 2개 -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="text-right leading-tight mr-0.5">
            <div class="text-[10px] font-medium" style="color: #94A3B8;">자동 5게임</div>
            <div class="text-[13.5px] font-extrabold tabular-nums mt-0.5" style="color: #0F172A;">5,000원</div>
          </div>

          <!-- 사이즈 고정 버튼 (에메랄드 그린 원형 36x36) -->
          <button id="btnLock" type="button" title="사이즈 고정 / 해제"
            class="w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm cursor-pointer transition-transform active:scale-95 shrink-0"
            style="background-color: #14B88A;">
            <!-- 잠금 상태 아이콘 (닫힌 자물쇠) -->
            <svg id="iconLocked" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
            </svg>
            <!-- 잠금 해제 상태 아이콘 (열린 자물쇠) -->
            <svg id="iconUnlocked" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
              <path d="M8 11V7a4 4 0 0 1 7.8-1.2"></path>
            </svg>
          </button>

          <!-- 번호 랜덤 돌리기 버튼 (다크 네이비 원형 36x36) -->
          <button id="btnShuffle" type="button" title="새 번호 5게임 추첨"
            class="w-9 h-9 rounded-full flex items-center justify-center text-white shadow-sm cursor-pointer transition-transform active:scale-95 shrink-0"
            style="background-color: #131B2E;">
            <svg id="shuffleIcon" class="w-4 h-4 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
              <path d="M16 16h5v5"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 2. 5게임 (A ~ E) 카드 리스트 -->
      <div id="gamesContainer" class="flex flex-col" style="gap: 6px;"></div>

      <!-- 3. 하단 푸터 안내 및 번호 복사 알약 버튼 -->
      <div class="flex items-center justify-between gap-2 mt-3">
        <span class="text-[10px] font-medium tracking-tight truncate" style="color: #94A3B8;">
          1~45 중복 없는 6개 번호 · 오름차순
        </span>
        <button id="btnCopyAll" type="button"
          class="rounded-full text-[11px] font-semibold cursor-pointer transition-colors shrink-0 active:scale-95"
          style="background-color: #F1F5F9; color: #334155; padding: 5px 12px;">
          번호 복사
        </button>
      </div>
    </div>

    <!-- 우측 하단 모서리 리사이즈 핸들 (잠금 해제 시에만 노출) -->
    <div id="handleCorner" class="handle-corner" title="드래그하여 위젯 크기 조절">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M12.5 3V12.5H3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- 미니 토스트 피드백 -->
    <div id="toast" class="pointer-events-none fixed left-1/2 bottom-3 -translate-x-1/2 z-50 opacity-0 transition-all duration-200 translate-y-1">
      <div id="toastMsg" class="px-3 py-1 rounded-full text-[11px] font-semibold bg-slate-900/90 text-white shadow-md whitespace-nowrap">
        복사되었습니다
      </div>
    </div>
  </div>

  <script>
    (function () {
      const LABELS = ['A', 'B', 'C', 'D', 'E'];
      const STORAGE_KEY = 'notion_lotto_645_widget_v4';
      const BASE_WIDTH = 300;
      const MIN_SCALE = 0.75;
      const MAX_SCALE = 1.8;

      let state = {
        games: [],
        isLocked: false,
        scale: 1
      };

      // DOM 참조
      const widgetWrapper = document.getElementById('widgetWrapper');
      const widgetContent = document.getElementById('widgetContent');
      const gamesContainer = document.getElementById('gamesContainer');
      const btnLock = document.getElementById('btnLock');
      const iconLocked = document.getElementById('iconLocked');
      const iconUnlocked = document.getElementById('iconUnlocked');
      const btnShuffle = document.getElementById('btnShuffle');
      const shuffleIcon = document.getElementById('shuffleIcon');
      const btnCopyAll = document.getElementById('btnCopyAll');
      const handleCorner = document.getElementById('handleCorner');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');

      let toastTimer = null;
      let copyBtnTimer = null;

      // 토스트 안내 표시
      function showToast(message) {
        toastMsg.textContent = message;
        toast.classList.remove('opacity-0', 'translate-y-1');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-1');
        }, 1500);
      }

      // 클립보드 복사 (노션 iFrame 샌드박스 호환 execCommand 우선 사용)
      function copyToClipboard(text, onSuccess) {
        let succeeded = false;
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.top = '-9999px';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          succeeded = document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (e) {
          succeeded = false;
        }

        if (succeeded) {
          if (onSuccess) onSuccess();
          return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            if (onSuccess) onSuccess();
          }).catch(() => {
            showToast('복사에 실패했습니다');
          });
        }
      }

      // 1~45 중복 없는 6개 오름차순 추첨
      function drawSingleGame() {
        const pool = Array.from({ length: 45 }, (_, i) => i + 1);
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, 6).sort((a, b) => a - b);
      }

      function drawFiveGames() {
        return Array.from({ length: 5 }, () => drawSingleGame());
      }

      // 번호 대역별 색상 클래스 반환
      function getBallClass(num) {
        if (num <= 10) return 'ball-yellow';
        if (num <= 20) return 'ball-blue';
        if (num <= 30) return 'ball-red';
        if (num <= 40) return 'ball-gray';
        return 'ball-green';
      }

      // 상태 저장 (localStorage + URL Hash 백업)
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          // 노션 샌드박스 환경 예외 무시
        }

        try {
          const payload = {
            g: state.games,
            l: state.isLocked ? 1 : 0,
            s: state.scale
          };
          const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
          window.history.replaceState(null, '', '#' + encoded);
        } catch (e) {
          // 해시 업데이트 제한 환경 무시
        }
      }

      // 저장된 상태 복원
      function loadState() {
        let restored = false;

        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed.games) && parsed.games.length === 5) {
              state = {
                games: parsed.games,
                isLocked: Boolean(parsed.isLocked),
                scale: typeof parsed.scale === 'number' ? parsed.scale : 1
              };
              restored = true;
            }
          }
        } catch (e) {
          // ignore
        }

        if (!restored && window.location.hash && window.location.hash.length > 2) {
          try {
            const raw = decodeURIComponent(atob(window.location.hash.slice(1)));
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed.g) && parsed.g.length === 5) {
              state.games = parsed.g;
              state.isLocked = Boolean(parsed.l);
              state.scale = typeof parsed.s === 'number' ? parsed.s : 1;
              restored = true;
            }
          } catch (e) {
            // ignore
          }
        }

        if (!restored || !state.games.length) {
          state.games = drawFiveGames();
        }
      }

      // 잠금 상태 및 비율 크기 반영
      function applySizeAndLockUI() {
        const scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, state.scale || 1));
        state.scale = scale;

        widgetContent.style.transform = `scale(${scale})`;
        const baseHeight = widgetContent.offsetHeight || 295;
        const cornerAllowance = state.isLocked ? 0 : 12;

        widgetWrapper.style.width = Math.round(BASE_WIDTH * scale + cornerAllowance) + 'px';
        widgetWrapper.style.height = Math.round(baseHeight * scale + cornerAllowance) + 'px';
        widgetWrapper.style.maxWidth = '100%';
        widgetWrapper.style.padding = '0';

        if (state.isLocked) {
          handleCorner.classList.add('hidden');
          iconLocked.classList.remove('hidden');
          iconUnlocked.classList.add('hidden');
          btnLock.style.backgroundColor = '#10A37F';
        } else {
          handleCorner.classList.remove('hidden');
          iconLocked.classList.add('hidden');
          iconUnlocked.classList.remove('hidden');
          btnLock.style.backgroundColor = '#14B88A';
        }
      }

      // 5게임 행 렌더링
      function renderGames(animate = false) {
        gamesContainer.innerHTML = '';

        state.games.forEach((numbers, rowIdx) => {
          const label = LABELS[rowIdx];
          const row = document.createElement('div');
          row.className = 'game-row flex items-center justify-between cursor-pointer';
          row.title = `클릭하여 ${label} 게임 번호 복사`;

          // 좌측: A~E + 자동
          const leftGroup = document.createElement('div');
          leftGroup.className = 'flex items-center gap-1.5 shrink-0';

          const letterSpan = document.createElement('span');
          letterSpan.className = 'text-[12px] font-extrabold tabular-nums';
          letterSpan.style.color = '#1E293B';
          letterSpan.textContent = label;

          const autoSpan = document.createElement('span');
          autoSpan.className = 'text-[10px] font-medium';
          autoSpan.style.color = '#94A3B8';
          autoSpan.textContent = '자동';

          leftGroup.appendChild(letterSpan);
          leftGroup.appendChild(autoSpan);

          // 우측: 6개 로또 공
          const ballsGroup = document.createElement('div');
          ballsGroup.className = 'flex items-center gap-1.5';

          numbers.forEach((num, ballIdx) => {
            const ball = document.createElement('span');
            ball.className = `lotto-ball tabular-nums ${getBallClass(num)} ${animate ? 'ball-animate' : ''}`;
            if (animate) {
              ball.style.animationDelay = `${rowIdx * 28 + ballIdx * 22}ms`;
            }
            ball.textContent = String(num);
            ballsGroup.appendChild(ball);
          });

          // 개별 행 클릭 복사 (예: A 자동 09 15 21 26 42 43)
          row.addEventListener('click', () => {
            const padded = numbers.map(n => String(n).padStart(2, '0')).join(' ');
            const lineText = `${label} 자동 ${padded}`;
            copyToClipboard(lineText, () => {
              showToast(`${lineText} 복사됨`);
            });
          });

          row.appendChild(leftGroup);
          row.appendChild(ballsGroup);
          gamesContainer.appendChild(row);
        });
      }

      // 우측 하단 모서리 드래그 비율 리사이즈 이벤트
      function setupResizeHandle() {
        let isResizing = false;
        let startX = 0;
        let startY = 0;
        let startScale = 1;

        function beginResize(e) {
          if (state.isLocked) return;
          e.preventDefault();
          isResizing = true;
          const pt = e.touches ? e.touches[0] : e;
          startX = pt.clientX;
          startY = pt.clientY;
          startScale = state.scale || 1;
        }

        function moveResize(e) {
          if (!isResizing) return;
          const pt = e.touches ? e.touches[0] : e;
          const dx = pt.clientX - startX;
          const dy = pt.clientY - startY;
          const delta = Math.abs(dx) >= Math.abs(dy) ? dx : dy;

          const maxViewportScale = Math.max(MIN_SCALE, (window.innerWidth - 12) / BASE_WIDTH);
          const nextScale = Math.max(
            MIN_SCALE,
            Math.min(Math.min(MAX_SCALE, maxViewportScale), +(startScale + delta / BASE_WIDTH).toFixed(3))
          );

          state.scale = nextScale;
          applySizeAndLockUI();
        }

        function finishResize() {
          if (!isResizing) return;
          isResizing = false;
          saveState();
        }

        handleCorner.addEventListener('mousedown', beginResize);
        handleCorner.addEventListener('touchstart', beginResize, { passive: false });

        window.addEventListener('mousemove', moveResize);
        window.addEventListener('touchmove', moveResize, { passive: false });
        window.addEventListener('mouseup', finishResize);
        window.addEventListener('touchend', finishResize);
      }

      // 버튼 이벤트 바인딩
      btnShuffle.addEventListener('click', () => {
        shuffleIcon.style.transform = 'rotate(360deg)';
        setTimeout(() => { shuffleIcon.style.transform = 'rotate(0deg)'; }, 300);

        state.games = drawFiveGames();
        renderGames(true);
        saveState();
      });

      btnLock.addEventListener('click', () => {
        state.isLocked = !state.isLocked;
        applySizeAndLockUI();
        saveState();
        showToast(state.isLocked ? '사이즈 고정됨' : '사이즈 고정 해제');
      });

      btnCopyAll.addEventListener('click', () => {
        const lines = state.games.map((nums, idx) => `${LABELS[idx]}: ${nums.join(', ')}`);
        const fullText = `[로또 6/45 자동 5게임]\n` + lines.join('\n');

        copyToClipboard(fullText, () => {
          btnCopyAll.textContent = '복사됨!';
          btnCopyAll.style.backgroundColor = '#DCFCE7';
          btnCopyAll.style.color = '#15803D';
          showToast('5게임 전체 번호가 복사되었습니다');

          clearTimeout(copyBtnTimer);
          copyBtnTimer = setTimeout(() => {
            btnCopyAll.textContent = '번호 복사';
            btnCopyAll.style.backgroundColor = '#F1F5F9';
            btnCopyAll.style.color = '#334155';
          }, 1500);
        });
      });

      // 초기 실행
      loadState();
      renderGames(true);
      applySizeAndLockUI();
      setupResizeHandle();
    })();
  </script>
</body>
</html>
